<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Unit 9 — Flashcards</title>
<style>
  :root {
    --bg: #f4f6fb;
    --bg2: #e8ecf7;
    --card: #ffffff;
    --text: #1a2233;
    --text-muted: #6b7794;
    --accent: #4a6cf7;
    --accent-soft: #e2e8ff;
    --border: #dde3f0;
    --shadow: 0 8px 30px rgba(30, 45, 90, 0.08);
    --success: #2bb673;
    --danger: #f2617a;
  }
  [data-theme="dark"] {
    --bg: #0f1420;
    --bg2: #161c2c;
    --card: #1c2336;
    --text: #eef1f8;
    --text-muted: #8b96b3;
    --accent: #6c8cff;
    --accent-soft: #232d4a;
    --border: #2a3350;
    --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    --success: #35d18a;
    --danger: #ff7a92;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background .35s ease, color .35s ease;
  }

  body {
    background: radial-gradient(1200px 600px at 20% -10%, var(--bg2), var(--bg) 60%);
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex: 1;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 4px 2px;
  }

  .logo {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .logo span { color: var(--accent); }

  .theme-toggle {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 50%;
    width: 42px; height: 42px;
    font-size: 19px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
    transition: transform .2s ease, background .3s;
  }
  .theme-toggle:active { transform: scale(.92); }

  .mode-tabs {
    display: flex;
    background: var(--card);
    border-radius: 14px;
    padding: 5px;
    gap: 5px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .mode-tabs button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
    padding: 11px 6px;
    border-radius: 10px;
    cursor: pointer;
    transition: all .2s ease;
  }
  .mode-tabs button.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(74,108,247,.35);
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px;
  }
  .progress-bar {
    flex: 1;
    height: 7px;
    background: var(--accent-soft);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #8aa4ff);
    border-radius: 99px;
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }
  .progress-text {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    min-width: 52px;
    text-align: right;
  }

  /* CARD */
  .card-scene {
    perspective: 1400px;
    width: 100%;
    flex: 1;
    min-height: 320px;
    display: flex;
  }

  .card {
    position: relative;
    width: 100%;
    min-height: 320px;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.4, 0, .2, 1);
    cursor: pointer;
    flex: 1;
  }
  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 22px;
    text-align: center;
    gap: 14px;
    transition: background .3s, border .3s;
  }

  .card-back { transform: rotateY(180deg); }

  .word {
    font-size: clamp(26px, 8vw, 40px);
    font-weight: 800;
    letter-spacing: -0.7px;
    line-height: 1.15;
    word-break: break-word;
  }
  .card-back .word {
    color: var(--accent);
  }

  .translation {
    font-size: clamp(17px, 5vw, 22px);
    color: var(--text-muted);
    font-weight: 500;
  }

  .hint {
    position: absolute;
    bottom: 16px;
    font-size: 11.5px;
    color: var(--text-muted);
    opacity: .7;
    letter-spacing: .3px;
  }

  .speak-btn {
    border: none;
    background: var(--accent-soft);
    color: var(--accent);
    width: 54px; height: 54px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .18s, background .3s;
  }
  .speak-btn:active { transform: scale(.9); }

  /* NAV */
  .nav {
    display: flex;
    gap: 10px;
  }
  .nav button {
    flex: 1;
    padding: 15px 10px;
    border-radius: 15px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform .15s, opacity .2s;
  }
  .nav button:active { transform: scale(.97); }
  .nav button.primary {
    background: var(--accent);
    color: #fff;
    border-color: transparent;
  }
  .nav button:disabled { opacity: .4; pointer-events: none; }

  /* INPUT MODE */
  .input-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .input-prompt {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px 20px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .input-prompt .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--text-muted);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .input-prompt .ru-word {
    font-size: clamp(23px, 7vw, 32px);
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .answer-input {
    width: 100%;
    padding: 17px 18px;
    font-size: 17px;
    border-radius: 15px;
    border: 2px solid var(--border);
    background: var(--card);
    color: var(--text);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
    font-family: inherit;
  }
  .answer-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  .answer-input.correct { border-color: var(--success); box-shadow: 0 0 0 4px rgba(43,182,115,.15); }
  .answer-input.wrong { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(242,97,122,.15); }

  .feedback {
    min-height: 26px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    transition: color .2s;
  }
  .feedback.ok { color: var(--success); }
  .feedback.no { color: var(--danger); }

  /* ALL LIST */
  .list-view {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
  }
  .list-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    transition: transform .15s;
  }
  .list-item:active { transform: scale(.985); }
  .list-text { flex: 1; min-width: 0; }
  .list-en {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  .list-ru {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 3px;
  }
  .list-speak {
    border: none;
    background: var(--accent-soft);
    color: var(--accent);
    width: 42px; height: 42px;
    border-radius: 12px;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s;
  }
  .list-speak:active { transform: scale(.88); }

  .hidden { display: none !important; }

  .counter-badge {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    font-weight: 600;
    letter-spacing: .3px;
  }

  @media (max-width: 380px) {
    .card-face { padding: 20px 14px; border-radius: 20px; }
    body { padding: 12px; }
  }

  @media (min-height: 780px) {
    .card-scene, .card { min-height: 400px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">Unit <span>9</span> · Flashcards</div>
    <button class="theme-toggle" id="themeToggle" aria-label="Сменить тему">🌙</button>
  </header>

  <div class="mode-tabs">
    <button class="active" data-mode="cards">Карточки</button>
    <button data-mode="input">Перевод</button>
    <button data-mode="list">Все слова</button>
  </div>

  <!-- CARDS MODE -->
  <div id="cardsMode" style="display:flex;flex-direction:column;gap:14px;flex:1;">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0/35</div>
    </div>

    <div class="card-scene">
      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="word" id="frontWord">appropriate</div>
          <div class="translation" id="frontTrans">подходящий</div>
          <div class="hint">нажмите на карточку, чтобы перевернуть</div>
        </div>
        <div class="card-face card-back">
          <div class="word" id="backWord">appropriate</div>
          <button class="speak-btn" id="speakBtnCard" aria-label="Прослушать">🔊</button>
          <div class="hint">нажмите, чтобы вернуться</div>
        </div>
      </div>
    </div>

    <div class="nav">
      <button id="prevBtn">← Назад</button>
      <button id="shuffleBtn">🔀</button>
      <button id="nextBtn" class="primary">Вперёд →</button>
    </div>
  </div>

  <!-- INPUT MODE -->
  <div id="inputMode" class="hidden" style="flex:1;flex-direction:column;gap:14px;">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="inputProgressFill"></div></div>
      <div class="progress-text" id="inputProgressText">0/35</div>
    </div>

    <div class="input-area">
      <div class="input-prompt">
        <div class="label">Переведите на английский</div>
        <div class="ru-word" id="ruPrompt">подходящий</div>
      </div>
      <input type="text" class="answer-input" id="answerInput" placeholder="Введите слово..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="feedback" id="feedback"></div>
      <div class="nav">
        <button id="checkBtn" class="primary">Проверить</button>
        <button id="skipBtn">Пропустить</button>
      </div>
    </div>
  </div>

  <!-- LIST MODE -->
  <div id="listMode" class="hidden" style="flex-direction:column;gap:10px;">
    <div class="counter-badge" id="listCounter"></div>
    <div class="list-view" id="listView"></div>
  </div>
</div>

<script>
const WORDS = [
  { en: "appropriate", ru: "подходящий" },
  { en: "average", ru: "средний" },
  { en: "bill", ru: "счёт" },
  { en: "breathtaking", ru: "захватывающий" },
  { en: "challenge", ru: "вызов (или испытание)" },
  { en: "client", ru: "клиент" },
  { en: "component", ru: "деталь (или компонент)" },
  { en: "container", ru: "контейнер" },
  { en: "courier", ru: "курьер" },
  { en: "demand", ru: "спрос" },
  { en: "dispatch", ru: "отправлять" },
  { en: "distribute", ru: "распространять (или распределять)" },
  { en: "distributor", ru: "дистрибьютор (или распространитель)" },
  { en: "enormous", ru: "огромный" },
  { en: "home improvement", ru: "благоустройство (или ремонт)" },
  { en: "in stock", ru: "в наличии" },
  { en: "inventory", ru: "запасы" },
  { en: "keep track of", ru: "отслеживать" },
  { en: "manufacturer", ru: "производитель (или изготовитель)" },
  { en: "motherboard", ru: "материнская плата" },
  { en: "out of stock", ru: "распродано (или отсутствует)" },
  { en: "performance", ru: "производительность (или результативность)" },
  { en: "raw material", ru: "сырьё" },
  { en: "retailer", ru: "ритейлер (или розничник)" },
  { en: "run low on", ru: "иссякать" },
  { en: "run out of", ru: "заканчиваться" },
  { en: "solution", ru: "решение" },
  { en: "stock up on", ru: "запасаться" },
  { en: "streamlined", ru: "оптимизированный" },
  { en: "supplier", ru: "поставщик" },
  { en: "supply chain", ru: "цепочка поставок (или снабжение)" },
  { en: "ultimately", ru: "в итоге (или окончательно)" },
  { en: "urgently", ru: "срочно" },
  { en: "warehouse", ru: "склад" }
];

/* ============ THEME ============ */
const themeToggle = document.getElementById('themeToggle');
function setTheme(dark) {
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  themeToggle.textContent = dark ? '☀️' : '🌙';
  localStorage.setItem('unit9-theme', dark ? 'dark' : 'light');
}
const savedTheme = localStorage.getItem('unit9-theme');
setTheme(savedTheme ? savedTheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
themeToggle.addEventListener('click', () => {
  setTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
});

/* ============ SPEECH ============ */
let voice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  voice = voices.find(v => v.lang === 'en-US' && /Samantha|Google US|Alex|Karen|Daniel/i.test(v.name))
       || voices.find(v => v.lang === 'en-US')
       || voices.find(v => v.lang.startsWith('en'))
       || null;
}
if ('speechSynthesis' in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.9;
  u.pitch = 1;
  if (voice) u.voice = voice;
  speechSynthesis.speak(u);
}

/* ============ CARDS MODE ============ */
let order = WORDS.map((_, i) => i);
let current = 0;
let learned = new Set();

const card = document.getElementById('card');
const frontWord = document.getElementById('frontWord');
const frontTrans = document.getElementById('frontTrans');
const backWord = document.getElementById('backWord');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');

function renderCard() {
  const idx = order[current];
  const w = WORDS[idx];
  card.classList.remove('flipped');
  frontWord.textContent = w.en;
  frontTrans.textContent = w.ru;
  backWord.textContent = w.en;
  updateProgress();
}
function updateProgress() {
  const pct = ((current + 1) / order.length) * 100;
  progressFill.style.width = pct + '%';
  progressText.textContent = (current + 1) + '/' + order.length;
}
card.addEventListener('click', (e) => {
  if (e.target.closest('.speak-btn')) return;
  card.classList.toggle('flipped');
});
document.getElementById('speakBtnCard').addEventListener('click', (e) => {
  e.stopPropagation();
  speak(WORDS[order[current]].en);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  current = (current + 1) % order.length;
  renderCard();
});
document.getElementById('prevBtn').addEventListener('click', () => {
  current = (current - 1 + order.length) % order.length;
  renderCard();
});
document.getElementById('shuffleBtn').addEventListener('click', () => {
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  current = 0;
  renderCard();
});
renderCard();

/* ============ INPUT MODE ============ */
let inputOrder = WORDS.map((_, i) => i);
let inputIndex = 0;
let inputScore = 0;

const ruPrompt = document.getElementById('ruPrompt');
const answerInput = document.getElementById('answerInput');
const feedback = document.getElementById('feedback');
const inputProgressFill = document.getElementById('inputProgressFill');
const inputProgressText = document.getElementById('inputProgressText');

function normalize(s) {
  return s.toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.,!?;:()\-–—]/g, '').replace(/\s+/g,' ').trim();
}

function renderInput() {
  const idx = inputOrder[inputIndex];
  const w = WORDS[idx];
  ruPrompt.textContent = w.ru;
  answerInput.value = '';
  answerInput.className = 'answer-input';
  feedback.textContent = '';
  feedback.className = 'feedback';
  answerInput.focus();
  const pct = ((inputIndex) / inputOrder.length) * 100;
  inputProgressFill.style.width = pct + '%';
  inputProgressText.textContent = (inputIndex + 1) + '/' + inputOrder.length;
}

function checkAnswer() {
  const idx = inputOrder[inputIndex];
  const w = WORDS[idx];
  const user = normalize(answerInput.value);
  const correct = normalize(w.en);

  if (user === correct) {
    answerInput.classList.add('correct');
    feedback.textContent = '✓ Правильно!';
    feedback.className = 'feedback ok';
    speak(w.en);
    setTimeout(() => {
      inputIndex++;
      if (inputIndex >= inputOrder.length) {
        inputProgressFill.style.width = '100%';
        inputProgressText.textContent = 'Готово!';
        ruPrompt.textContent = '🎉 Все слова пройдены!';
        answerInput.classList.add('hidden');
        feedback.textContent = '';
        document.getElementById('checkBtn').classList.add('hidden');
        document.getElementById('skipBtn').classList.add('hidden');
        return;
      }
      renderInput();
    }, 900);
  } else {
    answerInput.classList.add('wrong');
    feedback.textContent = '✗ Правильно: ' + w.en;
    feedback.className = 'feedback no';
    speak(w.en);
  }
}

document.getElementById('checkBtn').addEventListener('click', checkAnswer);
document.getElementById('skipBtn').addEventListener('click', () => {
  const w = WORDS[inputOrder[inputIndex]];
  feedback.textContent = '→ ' + w.en;
  feedback.className = 'feedback';
  speak(w.en);
});
answerInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkAnswer();
});
renderInput();

/* ============ LIST MODE ============ */
const listView = document.getElementById('listView');
const listCounter = document.getElementById('listCounter');
function renderList() {
  listCounter.textContent = 'Всего слов: ' + WORDS.length;
  listView.innerHTML = '';
  WORDS.forEach(w => {
    const item = document.createElement('div');
    item.className = 'list-item';
    item.innerHTML = `
      <div class="list-text">
        <div class="list-en">${w.en}</div>
        <div class="list-ru">${w.ru}</div>
      </div>
      <button class="list-speak" aria-label="Прослушать">🔊</button>
    `;
    item.querySelector('.list-speak').addEventListener('click', (e) => {
      e.stopPropagation();
      speak(w.en);
    });
    item.addEventListener('click', () => speak(w.en));
    listView.appendChild(item);
  });
}
renderList();

/* ============ MODE TABS ============ */
const tabs = document.querySelectorAll('.mode-tabs button');
const modes = {
  cards: document.getElementById('cardsMode'),
  input: document.getElementById('inputMode'),
  list: document.getElementById('listMode')
};
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const mode = tab.dataset.mode;
    Object.keys(modes).forEach(k => {
      modes[k].classList.toggle('hidden', k !== mode);
      if (k === mode && k !== 'list') modes[k].style.display = 'flex';
      if (k === mode && k === 'list') modes[k].style.display = 'flex';
    });
    if (mode === 'input') {
      // reset input if finished
      if (inputIndex >= inputOrder.length) {
        inputIndex = 0;
        inputOrder = WORDS.map((_, i) => i);
        answerInput.classList.remove('hidden');
        document.getElementById('checkBtn').classList.remove('hidden');
        document.getElementById('skipBtn').classList.remove('hidden');
        renderInput();
      }
      setTimeout(() => answerInput.focus(), 250);
    }
  });
});
</script>
</body>
</html>
